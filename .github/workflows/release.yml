name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"

  bundle:
    name: Build & upload (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: System dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build bundles
        run: pnpm tauri build
      - name: Upload bundles to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find src-tauri/target/release/bundle -type f \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
          \))
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No bundles found to upload" >&2
            exit 1
          fi
          printf 'Uploading: %s\n' "${files[@]}"
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
