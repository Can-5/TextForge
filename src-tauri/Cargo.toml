[package]
name = "textforge"
version = "0.1.0"
edition = "2021"
description = "Offline text and developer utilities (JSON, Markdown, Base64, hash, regex, diff and more)"
license = "MIT"

[lib]
name = "textforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
